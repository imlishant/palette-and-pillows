<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found | Palette &amp; Pillows</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=3" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .notfound {
        display: grid;
        min-height: 100svh;
        place-content: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
      }
      .notfound h1 {
        margin: 0;
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: clamp(2.4rem, 8vw, 4rem);
        font-weight: 600;
        line-height: 1;
      }
      .notfound p {
        margin: 0;
        color: rgba(23, 20, 17, 0.7);
      }
      .notfound .hero-actions {
        justify-content: center;
      }
      .notfound .button-secondary {
        border-color: var(--line);
        color: var(--ink);
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main class="notfound">
      <p class="section-kicker">Palette &amp; Pillows</p>
      <h1>That page went wandering.</h1>
      <p>The link you followed does not exist. The stay, happily, does.</p>
      <div class="hero-actions">
        <a class="button button-primary" style="background: var(--ink); color: var(--white)" href="/">Back to the stay</a>
        <a class="button button-secondary" href="https://airbnb.co.in/h/palette-and-pillows" target="_blank" rel="noopener noreferrer">View on Airbnb</a>
      </div>
    </main>
  </body>
</html>
